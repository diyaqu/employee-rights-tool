<style>
  :root{

  b.lead-label{
    display:block;color:var(--lead);font-size:15.5px;font-weight:700;

  .callout.red>b:first-child{color:#8a6a2b}

  /* ===== 阅读流（详情页：去卡片框，section 大留白，滚动节奏）===== */
  .cat-layout #catcard,.cat-layout #cat-lawyer{
    background:transparent;border:none;box-shadow:none;border-radius:0;padding:0;margin:0}
  .block{padding:38px 0 0;margin:0}

  #s-cat .fold-body>p{margin-bottom:19px}

  #s-cat .fold-body .pt>.lead-label{font-size:16px;margin-bottom:4px}

  .step .check span,.step .back,.step .fld,.step .state-pick label span,
  .src,.fineprint,b.lead-label,details.fold>summary::after{font-family:var(--sans)}

  @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
  /* 折叠 section：第一段默认展开（关键信息），其余点标题展开（progressive disclosure）*/
  details.fold{padding:0;margin:0;border-top:1px solid var(--line)}

    list-style:none;cursor:pointer;user-select:none;

  @media (min-width:900px){

</style>

// scroll-reveal: 进视口逐块 fade-up（Ethena 式阅读节奏）
let _io=null;
function observeReveals(scope){
  if(!('IntersectionObserver' in window)){
    (scope||document).querySelectorAll('.reveal').forEach(el=>el.classList.add('in')); return;
  }
  if(!_io){
    _io=new IntersectionObserver(es=>{es.forEach(e=>{
      if(e.isIntersecting){e.target.classList.add('in');_io.unobserve(e.target);}
    });},{threshold:.1,rootMargin:'0px 0px -6% 0px'});
  }
  (scope||document).querySelectorAll('.reveal:not(.in)').forEach(el=>_io.observe(el));
}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

// ===================== deadline helper (EEOC-based) =====================
function eeocCountdown(state,dateStr){
  const p=dateStr.split('-');
  // 用 setDate 加天数（避免 *86400000 在夏令时切换时差一天）
  const mkDdl=(n)=>{ const d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+n); d.setHours(0,0,0,0); return d; };
  const d180=mkDdl(180), d300=mkDdl(300);
  const today=new Date(); today.setHours(0,0,0,0);
  const days180=Math.round((d180-today)/86400000);
  const days300=Math.round((d300-today)/86400000);
  const is3=(state==='CA'||state==='NY');
  const sNote=is3?'<br>你在'+(state==='CA'?'加州':'纽约州')+'，州机构时效通常是 <b>3 年</b>（'+(state==='CA'?'加州 CRD':'纽约州 DHR')+'），比联邦窗口宽得多——联邦这条紧了，州那条往往还来得及。':'';
  let cd;
  if(days180>0){
    const danger=days180<=45;
    cd='<div class="countdown'+(danger?' danger':'')+'">联邦投诉窗口：事发后 <b>180–300 天</b>'
      +'<small>是 180 还是 300 天，取决于你所在州有没有对应的州级公平就业机构（有就通常按 300 天）。<b>按最稳的 180 天算，截止约 '+fmtDate(d180)+'；最长 300 天约 '+fmtDate(d300)+'。</b>务必向 EEOC 确认你这个州适用哪个，并尽量早做。'+sNote+'</small></div>'
      +(danger?'<p style="margin-top:12px;color:#8a6a2b"><b>按最短窗口算时间不多了，尽快更稳。</b></p>':'<p style="margin-top:12px">这类期限按天算，别拖——过了这条路可能就关了。</p>');
  } else if(days300>0){
    cd='<div class="countdown danger">可能已过最短 180 天，但或许还在 300 天窗口内<small>按事发日推算：180 天约 '+fmtDate(d180)+'（已过），300 天约 '+fmtDate(d300)+'。如果你所在州有州级公平就业机构，可能适用 300 天。<b>立刻向 EEOC 确认，别拖。</b>'+sNote+'</small></div>';
  } else {
    cd='<div class="countdown'+(is3?'':' danger')+'">联邦窗口（最长 300 天）可能已过<small>按事发日推算</small></div>'
      +'<p style="margin-top:12px"><b>先别放弃。</b>'+(is3?'你所在州时效通常 3 年，往往还来得及。':'有些州时效长得多；如果情况还在持续发生，时效可能重新计算。')+'务必找人确认，别自己下定论。'+sNote+'</p>';
  }
  return '<div class="card"><h2>你的时间窗口</h2>'+cd+'</div>';
}

  return '';
}

      if(a.sev==='unsigned'){r.pill='<span class="pill warn">先别签</span>';r.title='你还没签——这是最好的位置';

  nlra:{ icon:'', title:'因为和同事谈工资 / 一起发声被针对',
    entry:'因为和同事讨论工资、或一起发声，被针对了',
    entryD:'很多人不知道：这本身可能违法 → NLRA 集体行动权',

    law:'<p>受保护的例子：<b>和一个或多个同事讨论工资、福利</b>；一起向公司提集体诉求；组织大家改善工时/条件；为集体行动做准备。</p>'

    self:'<div class="magic">把"公司禁止讨论工资"的规定（员工手册截图）、或你因集体发声被处分的证据留好。记下时间线。</div>',

      {id:'what',type:'multi',q:'发生了下面哪件事吗（可多选）？',sub:'',

    ], result:(a)=>{
      const none=a.what&&a.what.length===1&&a.what[0]===4;

};

// ===================== content (library) page =====================
function openCat(key){
  track('category_open',{category:key});   // 哪类情况最多人点
  const c=CATS[key];
  let h='<header class="cat-head reveal"><h2>'+c.title+'</h2><p class="lede">'+c.intro+'</p></header>'
    +'<details class="block fold reveal" open><summary>这种情况，法律上是怎么回事</summary><div class="fold-body">'+c.law+'</div></details>'
    +'<details class="block fold reveal"><summary>先自己就能做的</summary><div class="fold-body">'+c.self+'</div></details>'
    +'<details class="block fold reveal"><summary>时间窗口（时效）</summary><div class="fold-body"><div class="lawline">'+c.sol+'</div></div></details>'
    +'<details class="block fold reveal"><summary>去哪找人帮忙</summary><div class="fold-body"><div class="lawline">'+c.channel+'</div>'+stateChannelBlock()+'</div></details>'
    +'<p class="src reveal">来源：'+c.src+'</p>';
  if(c.quiz){
    h+='<section class="block reveal"><div class="gf" style="margin-bottom:12px">想知道你<b>自己</b>这种情况大概是什么位置？做个 2 分钟自查（匿名，只在你手机上）。</div>'
      +'<button class="btn" onclick="quizStart(\''+key+'\')">2 分钟自查我的情况</button></section>';
  }
  document.getElementById('catcard').innerHTML=h;
  document.getElementById('cat-lawyer').innerHTML='<section class="block reveal">'+lawyerHelpBlock()+'</section>';
  document.getElementById('disc-cat').innerHTML=DISC;
  go('s-cat');
  requestAnimationFrame(()=>observeReveals(document.getElementById('s-cat')));
}

// ===================== generic quiz engine =====================
let Qkey=null, Qsteps=[], Qidx=0, QA={};
function quizStart(key){ track('quiz_start',{category:key}); Qkey=key; QA={}; Qidx=0; Qsteps=CATS[key].quiz.steps; renderStep(); go('s-quiz'); }
function quizBack(){ if(Qidx===0){ openCat(Qkey); } else { Qidx--; renderStep(); } }
function quizNext(){ if(Qidx<Qsteps.length-1){ Qidx++; renderStep(); } else { renderQuizResult(CATS[Qkey].quiz.result(QA)); } }
function quizPick(id,v){ QA[id]=v; quizNext(); }

function renderStep(){
  const s=Qsteps[Qidx];
  document.getElementById('qbar').style.width=Math.round((Qidx)/Qsteps.length*100+8)+'%';
  let h='<p class="q">'+s.q+'</p>'+(s.sub?'<p class="sub">'+s.sub+'</p>':'');
  if(s.type==='single'){
    h+=s.options.map(o=>'<button class="opt" onclick="quizPick(\''+s.id+'\',\''+o.v+'\')"><span class="t">'+o.t+'</span>'+(o.d?'<span class="d">'+o.d+'</span>':'')+'</button>').join('');
  } else if(s.type==='multi'){
    h+='<div id="multibox">'+s.items.map((t,i)=>'<label class="check"><input type="checkbox" value="'+i+'" onchange="multiToggle('+i+','+(s.none!=null?s.none:-1)+')"><span>'+t+'</span></label>').join('')+'</div>'
      +'<button class="btn" id="qnext" disabled onclick="commitMulti(\''+s.id+'\')">下一步 →</button>';
  } else if(s.type==='statesize'){
    const QORDER=['CA','NY','NJ','TX','WA','MA','IL','GA','PA','MD','VA','FL','OTHER'];
    const QLABEL={CA:'加州 California',NY:'纽约州 New York',NJ:'新泽西 New Jersey',TX:'德州 Texas',WA:'华盛顿州 Washington',MA:'麻州 Massachusetts',IL:'伊利诺伊 Illinois',GA:'佐治亚 Georgia',PA:'宾州 Pennsylvania',MD:'马里兰 Maryland',VA:'弗吉尼亚 Virginia',FL:'佛州 Florida',OTHER:'其他 / 不确定'};
    if(SELECTED_STATE && !QA.state) QA.state=SELECTED_STATE;   // 沿用首页选的州，列表与首页一致
    h+='<label class="fld">公司所在的州'+(SELECTED_STATE&&STATE_NAMES[SELECTED_STATE]?'（已沿用你选的'+STATE_NAMES[SELECTED_STATE]+'，可改）':'')+'</label><select id="qstate" onchange="syncSS('+(s.sizeOptional?'true':'false')+')"><option value="">请选择…</option>'
      +QORDER.map(k=>'<option value="'+k+'"'+(QA.state===k?' selected':'')+'>'+QLABEL[k]+'</option>').join('')+'</select>';
    if(!s.sizeOptional){
      h+='<p class="q" style="font-size:16px;margin-top:14px">公司大概有多少员工？</p>'
        +['1','5','15','50','?'].map(v=>{const lab={'1':'1–4 人','5':'5–14 人','15':'15–49 人','50':'50 人以上','?':'不确定'}[v];
          return '<button class="opt" data-sz="'+v+'" onclick="pickSize(event,\''+v+'\')"><span class="t">'+lab+'</span></button>';}).join('');
    }
    h+='<button class="btn" id="qnext" disabled onclick="commitSS()" style="margin-top:6px">下一步 →</button>';
    if(s.sizeOptional) QA.size='?';
  } else if(s.type==='date'){
    h+='<label class="fld">日期（不记得具体哪天，选当月 1 号也行）</label><input type="date" id="qdate" onchange="document.getElementById(\'qnext\').disabled=!this.value">'
      +'<button class="btn" id="qnext" disabled onclick="commitDate(\''+s.id+'\')" style="margin-top:16px">看整理结果 →</button>';
  }
  document.getElementById('quizbody').innerHTML=h;
  window.scrollTo({top:0,behavior:'instant'});
}
let multiSel=[];
function multiToggle(i,noneIdx){
  const box=document.getElementById('multibox');
  const cb=box.querySelector('input[value="'+i+'"]');
  if(noneIdx>=0){
    if(i===noneIdx && cb.checked){ box.querySelectorAll('input').forEach(o=>{if(o!==cb){o.checked=false;o.closest('.check').classList.remove('sel')}}); }
    else if(cb.checked){ const n=box.querySelector('input[value="'+noneIdx+'"]'); if(n&&n.checked){n.checked=false;n.closest('.check').classList.remove('sel')} }
  }
  cb.closest('.check').classList.toggle('sel',cb.checked);
  multiSel=[...box.querySelectorAll('input:checked')].map(o=>+o.value);
  document.getElementById('qnext').disabled=multiSel.length===0;
}
function commitMulti(id){ QA[id]=multiSel.slice(); multiSel=[]; quizNext(); }
function ssReady(sizeOptional){ return !!(QA.state && (sizeOptional || QA.size)); }
function syncSS(sizeOptional){ QA.state=document.getElementById('qstate').value; if(QA.state) setState(QA.state); document.getElementById('qnext').disabled=!ssReady(sizeOptional); }
function pickSize(ev,v){ QA.size=v; document.querySelectorAll('[data-sz]').forEach(b=>b.classList.remove('sel')); (ev&&ev.currentTarget?ev.currentTarget:document.querySelector('[data-sz="'+v+'"]')).classList.add('sel'); document.getElementById('qnext').disabled=!ssReady(false); }
function commitSS(){ quizNext(); }
function commitDate(id){ QA[id]=document.getElementById('qdate').value; quizNext(); }

function renderQuizResult(r){
  track('quiz_complete',{category:Qkey,verdict:(r.pill||'').replace(/<[^>]*>/g,'').trim()});  // 自查结果分布
  let h='<button class="back" onclick="openCat(\''+Qkey+'\')">← 返回</button>';
  h+='<div class="card">'+(r.pill||'')+'<h2>'+r.title+'</h2><p>'+r.body+'</p>'
    +(r.note?'<div class="callout">'+r.note+'</div>':'')+(r.tag?'<p class="tag">'+r.tag+'</p>':'')+'</div>';
  if(r.countdown) h+=r.countdown;
  h+=actionsCard();
  if(r.goodfaith) h+='<div class="card gf">'+GF+'</div>';
  h+='<div class="card">'+lawyerHelpBlock()+'</div>';
  h+='<button class="btn ghost" onclick="location.reload()">重新开始 / 帮朋友测一次</button>';
  h+='<p class="disc">'+DISC+'</p>';
  document.getElementById('quizresbody').innerHTML=h;
  go('s-quizres');
}

  '401k':{ h:'401(k) / 退休金',

      +'<p>找 401(k) 的 <b>plan administrator</b>（Fidelity / Vanguard / Empower，对账单上有），问 <code>rollover</code> 流程。</p>' },
  reimb:{ h:'报销 / 离职清单',
    body:'<div class="magic"><b>报销卡住：</b>书面邮件 HR，写明 <code>expense reimbursement</code> 的提交截止和发放时间，附单据。</div>'
      +'<div class="magic"><b>没收到离职清单：</b>主动邮件要 <code>offboarding checklist</code>，包括最后工资、福利截止日(<code>COBRA</code> 通知)、未休假折现等。书面留痕。</div>' }
